  <g transform="translate(20 108)">
    <rect x="0" y="-22" width="7" height="22" rx="2" fill="#22D3EE"/>
    <rect x="11" y="-36" width="7" height="36" rx="2" fill="#22D3EE"/>
    <rect x="22" y="-18" width="7" height="18" rx="2" fill="#14B8A6"/>
