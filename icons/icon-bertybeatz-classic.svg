  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#bbPlate)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="none" stroke="url(#bbRim)" stroke-width="3" opacity="0.9"/>
  <!-- 4-step beat pads -->
