    <rect x="55" y="-48" width="7" height="48" rx="2" fill="#6D28D9"/>
    <rect x="66" y="-20" width="7" height="20" rx="2" fill="#6D28D9"/>
    <rect x="77" y="-38" width="7" height="38" rx="2" fill="#F59E0B"/>
