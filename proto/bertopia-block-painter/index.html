<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>Block painter</title>
<style>
  :root {
    --bg: #d5d3ce;
    --panel: #f3f2ef;
    --ink: #2c2b28;
    --line: #5e5c57;
    --soft: #e4e2dc;
    --cell: 26;
    --cx: 7;
    --cy: 7;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    min-height: 100vh;
    font: 16px/1.35 system-ui, sans-serif;
    user-select: none;
  }
  button { font: inherit; color: inherit; }
  .app {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 208px minmax(0, 1fr) 300px;
    grid-template-rows: auto minmax(0, 1fr);
    gap: 8px;
    padding: 8px;
    align-items: start;
  }
  .prompt {
    grid-column: 1 / -1;
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: 8px 12px;
  }
  h1 { margin: 0; font-size: 22px; font-weight: 750; letter-spacing: 0; }
  #hint { margin: 2px 0 0; font-size: 15px; }
  .tools { display: flex; flex-direction: column; gap: 6px; }
  .tool, .use, .swatch {
    min-width: 48px;
    min-height: 48px;
    border: 2px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
  }
  .tool {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 8px;
    text-align: left;
    white-space: nowrap;
    font-weight: 650;
    font-size: 15px;
  }
  .tool svg, .use svg { width: 22px; height: 22px; flex: 0 0 auto; display: block; }
  .tool kbd, .use kbd {
    margin-left: auto;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 3px 5px;
    background: var(--soft);
    font: 700 12px/1 system-ui, sans-serif;
  }
  .tool .state { font-size: 12px; font-weight: 750; }
  .tool[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
  .tool[aria-pressed="true"] kbd { background: transparent; color: var(--panel); border-color: #c8c6c0; }
  .tool:disabled { opacity: 0.4; }
  .center { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  #meta { margin: 0; font-size: 14px; font-weight: 650; }
  #grid {
    position: relative;
    width: calc(var(--cell) * 16px);
    height: calc(var(--cell) * 16px);
    box-sizing: content-box;
    border: 2px solid var(--line);
    background: #f4f0e6;
    touch-action: none;
    flex: 0 0 auto;
  }
  #paint {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #lines {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(44, 43, 40, 0.2) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(44, 43, 40, 0.2) 1px, transparent 1px);
    background-size: calc(var(--cell) * 1px) calc(var(--cell) * 1px);
    pointer-events: none;
    z-index: 1;
  }
  #cursor {
    position: absolute;
    z-index: 2;
    left: 0;
    top: 0;
    width: calc(var(--cell) * 1px);
    height: calc(var(--cell) * 1px);
    transform: translate(calc(var(--cx) * var(--cell) * 1px), calc(var(--cy) * var(--cell) * 1px));
    border: 2px solid #1a1a18;
    outline: 2px solid #f7f6f2;
    outline-offset: -4px;
    pointer-events: none;
    box-sizing: border-box;
  }
  .palette {
    display: grid;
    grid-template-columns: repeat(8, minmax(48px, 1fr));
    gap: 6px;
  }
  .swatch {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 4px 2px;
    font: 700 11px/1 system-ui, sans-serif;
  }
  .swatch .dot {
    width: 22px;
    height: 12px;
    border: 1px solid var(--ink);
    border-radius: 2px;
  }
  .swatch[aria-pressed="true"] {
    outline: 3px solid var(--ink);
    outline-offset: -3px;
    background: #fff;
  }
  .side {
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .panel-label { margin: 0; font-size: 13px; font-weight: 750; }
  .preview-stage, .yard { perspective: 700px; }
  .preview-stage {
    height: 164px;
    display: grid;
    place-items: center;
  }
  .cube { transform-style: preserve-3d; position: relative; }
  .preview-cube {
    --cube: 108px;
    width: var(--cube);
    height: var(--cube);
    animation: spin 28s linear infinite;
    will-change: transform;
  }
  .mini {
    --cube: 48px;
    position: absolute;
    left: 0;
    top: 0;
    width: var(--cube);
    height: var(--cube);
    margin-left: calc(var(--cube) / -2);
    margin-top: calc(var(--cube) / -2);
  }
  .face {
    position: absolute;
    inset: 0;
    overflow: hidden;
    backface-visibility: hidden;
    box-shadow: inset 0 0 0 2px rgba(44, 43, 40, 0.5);
  }
  .face img {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    pointer-events: none;
  }
  .front  { transform: translateZ(calc(var(--cube) / 2)); }
  .back   { transform: rotateY(180deg) translateZ(calc(var(--cube) / 2)); }
  .right  { transform: rotateY(90deg) translateZ(calc(var(--cube) / 2)); }
  .left   { transform: rotateY(-90deg) translateZ(calc(var(--cube) / 2)); }
  .top    { transform: rotateX(90deg) translateZ(calc(var(--cube) / 2)); }
  .bottom { transform: rotateX(-90deg) translateZ(calc(var(--cube) / 2)); }
  @keyframes spin {
    from { transform: rotateX(-22deg) rotateY(-40deg); }
    to   { transform: rotateX(-22deg) rotateY(320deg); }
  }
  .yard { height: 210px; position: relative; }
  .world {
    position: absolute;
    left: 50%;
    top: 46%;
    width: 0;
    height: 0;
    transform-style: preserve-3d;
    transform: rotateX(-32deg) rotateY(-40deg);
  }
  .floor {
    position: absolute;
    left: 0;
    top: 0;
    width: 250px;
    height: 120px;
    margin-left: -125px;
    margin-top: -60px;
    background: #c9c6bf;
    border: 2px solid #5e5c57;
    transform: rotateX(90deg) translateZ(-30px);
  }
  .legend { list-style: none; margin: 0; padding: 0; display: flex; gap: 12px; }
  .legend li { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; }
  .legend img {
    width: 32px;
    height: 16px;
    border: 1px solid var(--ink);
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #scene-note { margin: 0; font-size: 14px; white-space: pre-line; }
  .use {
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--ink);
    color: var(--panel);
    font-weight: 750;
    font-size: 18px;
    padding: 8px 12px;
  }
  .use kbd { margin-left: 0; color: var(--panel); border-color: #c8c6c0; background: transparent; }
  :focus-visible { outline: 3px solid #1a1a18; outline-offset: 2px; }
  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  @media (prefers-reduced-motion: reduce) {
    .preview-cube {
      animation: none;
      transform: rotateX(-22deg) rotateY(-40deg);
      will-change: auto;
    }
  }
  @media (forced-colors: active) {
    .dot, .face img, #paint, .legend img { forced-color-adjust: none; }
  }
  @media (max-width: 1100px) {
    .app { grid-template-columns: 1fr; }
    .tools { flex-direction: row; flex-wrap: wrap; }
    .tool { flex: 1 1 148px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="prompt">
    <h1>paint your dirt</h1>
    <p id="hint">Fill and Dirt are ready. Tap the grid once.</p>
  </header>
  <div class="tools" role="toolbar" aria-label="Tools">
    <button type="button" class="tool" id="tool-pencil" data-tool="pencil" aria-pressed="false" aria-keyshortcuts="P">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4.1-1.1L19 8.1 15.9 5 5.1 15.8 4 20z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M13.6 7.2l3.2 3.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span class="word">Pencil</span><kbd>P</kbd>
    </button>
    <button type="button" class="tool" id="tool-fill" data-tool="fill" aria-pressed="true" aria-keyshortcuts="F">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l7 7-6.2 6.2H5.2L3 16.2l4.8-4.8L6 9.5 7 5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M16 15.2c.8 1.2 2.6 1.5 3.4.4.9-1.3-.2-2.6-.2-2.6s-2.4.6-3.2 2.2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span class="word">Fill</span><kbd>F</kbd>
    </button>
    <button type="button" class="tool" id="tool-eraser" data-tool="eraser" aria-pressed="false" aria-keyshortcuts="E">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14.5l6-7.2 7.2 6L11.2 20H7L4 14.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 20h11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="word">Eraser</span><kbd>E</kbd>
    </button>
    <button type="button" class="tool" id="tool-dropper" data-tool="dropper" aria-pressed="false" aria-keyshortcuts="I">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5l5 5M13.2 6.2l4.6 4.6-8.2 8.2H5.5v-4.1l7.7-8.7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span class="word">Eyedropper</span><kbd>I</kbd>
    </button>
    <button type="button" class="tool" id="tool-mirror" aria-pressed="false" aria-keyshortcuts="M">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M8 7H4.5L7 12l-2.5 5H8M16 7h3.5L17 12l2.5 5H16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <span class="word">Mirror</span><span class="state" id="mirror-state">Off</span><kbd>M</kbd>
    </button>
    <button type="button" class="tool" id="tool-undo" aria-keyshortcuts="Z" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8H4v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 11a7 7 0 1 1 1.2 6.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="word">Undo</span><kbd>Z</kbd>
    </button>
    <button type="button" class="tool" id="tool-redo" aria-keyshortcuts="Y" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 8h4v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 11a7 7 0 1 0-1.2 6.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="word">Redo</span><kbd>Y</kbd>
    </button>
    <button type="button" class="tool" id="tool-zoom" aria-keyshortcuts="+">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M14.5 14.5L20 20M10 7.5v5M7.5 10h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="word">Zoom 1</span><kbd>+</kbd>
    </button>
  </div>
  <main class="center">
    <p id="meta">Row 8 · Column 8 · Fill · Dirt · Mirror off</p>
    <div id="grid" tabindex="0" role="application" aria-label="Painting grid. Arrow keys move the cursor. Space paints.">
      <canvas id="paint" width="16" height="16"></canvas>
      <div id="lines" aria-hidden="true"></div>
      <div id="cursor" aria-hidden="true"></div>
    </div>
    <div class="palette" id="palette" role="group" aria-label="32 colors. Each swatch has its name."></div>
  </main>
  <aside class="side">
    <p class="panel-label">Preview</p>
    <div class="preview-stage" id="preview-stage" role="img" aria-label="Cube with your paint on every face"></div>
    <p class="panel-label">Scene</p>
    <div class="yard" id="yard" role="img" aria-label="Test scene. Dirt blocks are striped. Stone blocks are gray.">
      <div class="world" id="world"></div>
    </div>
    <ul class="legend">
      <li><img id="dirt-key" alt="" width="32" height="16"> Dirt blocks</li>
      <li><img id="stone-key" alt="" width="32" height="16"> Stone blocks</li>
    </ul>
    <p id="scene-note">Dirt blocks are striped.
Stone stays gray.</p>
    <button type="button" class="use" id="use" aria-keyshortcuts="U">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span class="word">Use it</span><kbd>U</kbd>
    </button>
  </aside>
</div>
<p id="live" class="sr" aria-live="polite"></p>
<script>
(function () {
  var COLORS = [
    ['Empty', '#F4F0E6'],
    ['White', '#F7F7F4'],
    ['Cream', '#E4D2A8'],
    ['Sand', '#C6A36E'],
    ['Dirt', '#8B5A34'],
    ['Bark', '#6A3E28'],
    ['Cocoa', '#4A3024'],
    ['Gray', '#8A8A86'],
    ['Stone', '#6A6A66'],
    ['Slate', '#4C4C48'],
    ['Ink', '#2A2A28'],
    ['Orange', '#E85820'],
    ['Clay', '#C46A3C'],
    ['Rust', '#8E4632'],
    ['Berry', '#884C54'],
    ['Blush', '#D4B0A6'],
    ['Gold', '#C4A05C'],
    ['Wheat', '#E0C98C'],
    ['Leaf', '#5C7346'],
    ['Moss', '#3E5238'],
    ['Pine', '#2C3C30'],
    ['Olive', '#7A7248'],
    ['Sky', '#7E9AAA'],
    ['Water', '#4E6E7C'],
    ['Deep', '#2E4450'],
    ['Lilac', '#8E849C'],
    ['Plum', '#5C4E62'],
    ['Fog', '#C6C4BC'],
    ['Paper', '#E6E1D4'],
    ['Rose', '#C08888'],
    ['Teal', '#4E736C'],
    ['Tan', '#A68464']
  ];
  var EMPTY = 0;
  var DIRT = 4;
  var SIZE = 16;
  var FACES = ['front', 'back', 'right', 'left', 'top', 'bottom'];
  var ZOOMS = [26, 34, 42];
  var LAYOUT = [
    { kind: 'dirt', x: -72, y: 0, z: 0 },
    { kind: 'dirt', x: -24, y: 0, z: 0 },
    { kind: 'dirt', x: 24, y: 0, z: 0 },
    { kind: 'stone', x: -24, y: -48, z: 0 },
    { kind: 'stone', x: 72, y: 0, z: 0 }
  ];

  var pixels = new Uint8Array(SIZE * SIZE);
  var rgb = COLORS.map(function (row) {
    var n = parseInt(row[1].slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  });
  var tool = 'fill';
  var colorIndex = DIRT;
  var mirror = false;
  var cx = 7;
  var cy = 7;
  var zoomI = 0;
  var undoStack = [];
  var redoStack = [];
  var before = null;
  var activePointer = null;
  var lastX = 0;
  var lastY = 0;
  var grid = document.getElementById('grid');
  var canvas = document.getElementById('paint');
  var ctx = canvas.getContext('2d', { alpha: false });
  var imgData = ctx.createImageData(SIZE, SIZE);
  var meta = document.getElementById('meta');
  var hint = document.getElementById('hint');
  var live = document.getElementById('live');
  var mirrorState = document.getElementById('mirror-state');
  var undoBtn = document.getElementById('tool-undo');
  var redoBtn = document.getElementById('tool-redo');
  var zoomBtn = document.getElementById('tool-zoom');
  var sceneNote = document.getElementById('scene-note');
  var yard = document.getElementById('yard');
  var world = document.getElementById('world');
  var palette = document.getElementById('palette');
  var previewImgs = [];
  var dirtImgs = [];
  var stoneImgs = [];

  ctx.imageSmoothingEnabled = false;

  function say(text) { live.textContent = text; }

  function toolName() {
    if (tool === 'pencil') return 'Pencil';
    if (tool === 'fill') return 'Fill';
    if (tool === 'eraser') return 'Eraser';
    return 'Eyedropper';
  }

  function updateMeta() {
    var text = 'Row ' + (cy + 1) + ' · Column ' + (cx + 1) + ' · ' + toolName() + ' · ' + COLORS[colorIndex][0] + ' · Mirror ' + (mirror ? 'on' : 'off');
    if (meta.textContent !== text) meta.textContent = text;
  }

  function placeCursor() {
    grid.style.setProperty('--cx', String(cx));
    grid.style.setProperty('--cy', String(cy));
    updateMeta();
  }

  function refreshHistory() {
    undoBtn.disabled = undoStack.length === 0;
    redoBtn.disabled = redoStack.length === 0;
  }

  function setHintFromPixels() {
    var allDirt = true;
    var i;
    for (i = 0; i < pixels.length; i++) {
      if (pixels[i] !== DIRT) { allDirt = false; break; }
    }
    if (allDirt) hint.textContent = 'Dirt is painted. Tap Use it.';
    else if (undoStack.length) hint.textContent = 'Tap Use it to place this paint.';
    else hint.textContent = 'Fill and Dirt are ready. Tap the grid once.';
  }

  function redraw() {
    var d = imgData.data;
    var i;
    for (i = 0; i < pixels.length; i++) {
      var c = rgb[pixels[i]];
      var o = i * 4;
      d[o] = c[0];
      d[o + 1] = c[1];
      d[o + 2] = c[2];
      d[o + 3] = 255;
    }
    ctx.putImageData(imgData, 0, 0);
  }

  var TEX = 64;
  function crispURL(source) {
    var big = document.createElement('canvas');
    big.width = TEX;
    big.height = TEX;
    var g = big.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.drawImage(source, 0, 0, TEX, TEX);
    return big.toDataURL();
  }

  var texFrame = 0;
  function queueTex() {
    if (texFrame) return;
    texFrame = requestAnimationFrame(function () {
      texFrame = 0;
      var url = crispURL(canvas);
      var i;
      for (i = 0; i < previewImgs.length; i++) previewImgs[i].src = url;
    });
  }

  function solidURL(hex) {
    var c = document.createElement('canvas');
    c.width = SIZE;
    c.height = SIZE;
    var g = c.getContext('2d');
    g.fillStyle = hex;
    g.fillRect(0, 0, SIZE, SIZE);
    return crispURL(c);
  }

  function stripeURL() {
    var c = document.createElement('canvas');
    c.width = SIZE;
    c.height = SIZE;
    var g = c.getContext('2d');
    var y, x;
    for (y = 0; y < SIZE; y++) {
      for (x = 0; x < SIZE; x++) {
        g.fillStyle = ((x + y) & 2) ? '#8A8A86' : '#E4E1DA';
        g.fillRect(x, y, 1, 1);
      }
    }
    return crispURL(c);
  }

  function buildCube(parent, className, url, bucket) {
    var cube = document.createElement('div');
    cube.className = 'cube ' + className;
    var f;
    for (f = 0; f < FACES.length; f++) {
      var face = document.createElement('div');
      face.className = 'face ' + FACES[f];
      var img = document.createElement('img');
      img.alt = '';
      img.draggable = false;
      img.src = url;
      face.appendChild(img);
      cube.appendChild(face);
      bucket.push(img);
    }
    parent.appendChild(cube);
    return cube;
  }

  function setPix(x, y, color) {
    var i = y * SIZE + x;
    if (pixels[i] === color) return false;
    pixels[i] = color;
    return true;
  }

  function stamp(x, y, color) {
    var changed = setPix(x, y, color);
    if (mirror) {
      var mx = SIZE - 1 - x;
      if (mx !== x) changed = setPix(mx, y, color) || changed;
    }
    return changed;
  }

  function paintLine(x0, y0, x1, y1, color) {
    var changed = false;
    var dx = Math.abs(x1 - x0);
    var dy = Math.abs(y1 - y0);
    var sx = x0 < x1 ? 1 : -1;
    var sy = y0 < y1 ? 1 : -1;
    var err = dx - dy;
    while (true) {
      if (stamp(x0, y0, color)) changed = true;
      if (x0 === x1 && y0 === y1) break;
      var e2 = 2 * err;
      if (e2 > -dy) { err -= dy; x0 += sx; }
      if (e2 < dx) { err += dx; y0 += sy; }
    }
    return changed;
  }

  function flood(x, y, target) {
    var src = pixels[y * SIZE + x];
    if (src === target) return false;
    var stack = [x, y];
    var seen = new Uint8Array(SIZE * SIZE);
    var changed = false;
    while (stack.length) {
      var py = stack.pop();
      var px = stack.pop();
      var i = py * SIZE + px;
      if (seen[i] || pixels[i] !== src) continue;
      seen[i] = 1;
      pixels[i] = target;
      changed = true;
      if (px > 0) stack.push(px - 1, py);
      if (px < SIZE - 1) stack.push(px + 1, py);
      if (py > 0) stack.push(px, py - 1);
      if (py < SIZE - 1) stack.push(px, py + 1);
    }
    return changed;
  }

  function beginStroke() { before = pixels.slice(); }

  function endStroke() {
    if (!before) return;
    var same = true;
    var i;
    for (i = 0; i < pixels.length; i++) {
      if (before[i] !== pixels[i]) { same = false; break; }
    }
    if (!same) {
      undoStack.push(before);
      if (undoStack.length > 50) undoStack.shift();
      redoStack.length = 0;
      refreshHistory();
      setHintFromPixels();
    }
    before = null;
  }

  function restore(next) {
    pixels.set(next);
    redraw();
    queueTex();
    setHintFromPixels();
    refreshHistory();
  }

  function undo() {
    if (!undoStack.length) { say('Nothing to undo.'); return; }
    redoStack.push(pixels.slice());
    restore(undoStack.pop());
    say('Undid the last paint.');
  }

  function redo() {
    if (!redoStack.length) { say('Nothing to redo.'); return; }
    undoStack.push(pixels.slice());
    restore(redoStack.pop());
    say('Redid the last paint.');
  }

  function setSwatchPressed() {
    var buttons = palette.children;
    var i;
    for (i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute('aria-pressed', i === colorIndex ? 'true' : 'false');
    }
  }

  function setTool(next) {
    tool = next;
    var buttons = document.querySelectorAll('.tool[data-tool]');
    var i;
    for (i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute('aria-pressed', buttons[i].dataset.tool === next ? 'true' : 'false');
    }
    updateMeta();
  }

  function selectColor(index) {
    colorIndex = index;
    setSwatchPressed();
    updateMeta();
    say(COLORS[index][0] + '.');
  }

  function toggleMirror() {
    mirror = !mirror;
    var btn = document.getElementById('tool-mirror');
    btn.setAttribute('aria-pressed', mirror ? 'true' : 'false');
    mirrorState.textContent = mirror ? 'On' : 'Off';
    updateMeta();
    say(mirror ? 'Mirror is on. Left and right match.' : 'Mirror is off.');
  }

  function cycleZoom() {
    zoomI = (zoomI + 1) % ZOOMS.length;
    document.documentElement.style.setProperty('--cell', String(ZOOMS[zoomI]));
    zoomBtn.querySelector('.word').textContent = 'Zoom ' + (zoomI + 1);
    say('Zoom ' + (zoomI + 1) + '.');
  }

  function applyAt(x, y) {
    if (tool === 'fill') return flood(x, y, colorIndex);
    if (tool === 'eraser') return stamp(x, y, EMPTY);
    if (tool === 'pencil') return stamp(x, y, colorIndex);
    return false;
  }

  function paintAtCursor() {
    if (tool === 'dropper') {
      selectColor(pixels[cy * SIZE + cx]);
      setTool('pencil');
      say('Pencil. Color ' + COLORS[colorIndex][0] + '.');
      return;
    }
    beginStroke();
    if (applyAt(cx, cy)) {
      redraw();
      queueTex();
    }
    endStroke();
  }

  function clampCell(v) { return v < 0 ? 0 : v > SIZE - 1 ? SIZE - 1 : v; }

  function cellFromEvent(e) {
    var rect = grid.getBoundingClientRect();
    var x = Math.floor(((e.clientX - rect.left) / rect.width) * SIZE);
    var y = Math.floor(((e.clientY - rect.top) / rect.height) * SIZE);
    return [clampCell(x), clampCell(y)];
  }

  function useIt() {
    var url = crispURL(canvas);
    var i;
    for (i = 0; i < dirtImgs.length; i++) dirtImgs[i].src = url;
    document.getElementById('dirt-key').src = url;
    sceneNote.textContent = 'Dirt blocks show your paint.\nStone stays gray.';
    yard.setAttribute('aria-label', 'Test scene. Dirt blocks show your paint. Stone blocks are gray.');
    say('Dirt blocks now use your paint. Stone stays gray.');
  }

  function move(dx, dy) {
    cx = clampCell(cx + dx);
    cy = clampCell(cy + dy);
    placeCursor();
  }

  COLORS.forEach(function (row, index) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'swatch';
    btn.dataset.hex = row[1];
    btn.setAttribute('aria-label', row[0]);
    btn.setAttribute('aria-pressed', index === colorIndex ? 'true' : 'false');
    var dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = row[1];
    var name = document.createElement('span');
    name.className = 'name';
    name.textContent = row[0];
    btn.appendChild(dot);
    btn.appendChild(name);
    btn.addEventListener('click', function () { selectColor(index); });
    palette.appendChild(btn);
  });

  redraw();
  var stripes = stripeURL();
  var stone = solidURL(COLORS[8][1]);
  var floor = document.createElement('div');
  floor.className = 'floor';
  world.appendChild(floor);
  previewImgs = [];
  buildCube(document.getElementById('preview-stage'), 'preview-cube', crispURL(canvas), previewImgs);
  LAYOUT.forEach(function (block) {
    var bucket = block.kind === 'dirt' ? dirtImgs : stoneImgs;
    var cube = buildCube(world, 'mini', block.kind === 'dirt' ? stripes : stone, bucket);
    cube.style.transform = 'translate3d(' + block.x + 'px,' + block.y + 'px,' + block.z + 'px)';
  });
  document.getElementById('dirt-key').src = stripes;
  document.getElementById('stone-key').src = stone;
  placeCursor();
  grid.focus({ preventScroll: true });

  document.querySelector('.tools').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn || btn.disabled) return;
    if (btn.dataset.tool) {
      setTool(btn.dataset.tool);
      say(toolName() + '.');
    } else if (btn.id === 'tool-mirror') toggleMirror();
    else if (btn.id === 'tool-undo') undo();
    else if (btn.id === 'tool-redo') redo();
    else if (btn.id === 'tool-zoom') cycleZoom();
  });
  document.getElementById('use').addEventListener('click', useIt);

  grid.addEventListener('pointerdown', function (e) {
    if (e.button !== 0 || activePointer !== null) return;
    activePointer = e.pointerId;
    try { grid.setPointerCapture(e.pointerId); } catch (err) { /* a lost pointer should still paint */ }
    grid.focus({ preventScroll: true });
    e.preventDefault();
    var cell = cellFromEvent(e);
    cx = cell[0];
    cy = cell[1];
    placeCursor();
    if (tool === 'dropper') {
      selectColor(pixels[cy * SIZE + cx]);
      setTool('pencil');
      say('Pencil. Color ' + COLORS[colorIndex][0] + '.');
      lastX = cx;
      lastY = cy;
      return;
    }
    beginStroke();
    var changed = false;
    if (tool === 'pencil' || tool === 'eraser') changed = paintLine(cx, cy, cx, cy, tool === 'eraser' ? EMPTY : colorIndex);
    else changed = applyAt(cx, cy);
    if (changed) { redraw(); queueTex(); }
    lastX = cx;
    lastY = cy;
  });

  grid.addEventListener('pointermove', function (e) {
    if (e.pointerId !== activePointer) return;
    if (tool !== 'pencil' && tool !== 'eraser') {
      var hover = cellFromEvent(e);
      cx = hover[0];
      cy = hover[1];
      placeCursor();
      return;
    }
    var cell = cellFromEvent(e);
    if (cell[0] === lastX && cell[1] === lastY) return;
    var changed = paintLine(lastX, lastY, cell[0], cell[1], tool === 'eraser' ? EMPTY : colorIndex);
    if (changed) { redraw(); queueTex(); }
    cx = cell[0];
    cy = cell[1];
    lastX = cx;
    lastY = cy;
    placeCursor();
  });

  function endPointer(e) {
    if (e.pointerId !== activePointer) return;
    activePointer = null;
    endStroke();
  }
  grid.addEventListener('pointerup', endPointer);
  grid.addEventListener('pointercancel', endPointer);
  grid.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  document.addEventListener('keydown', function (e) {
    var key = e.key;
    if (key === 'ArrowUp' || key === 'ArrowDown' || key === 'ArrowLeft' || key === 'ArrowRight') {
      e.preventDefault();
      if (key === 'ArrowUp') move(0, -1);
      else if (key === 'ArrowDown') move(0, 1);
      else if (key === 'ArrowLeft') move(-1, 0);
      else move(1, 0);
      return;
    }
    if (key === ' ' || key === 'Spacebar') {
      e.preventDefault();
      paintAtCursor();
      return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey) {
      var lowMod = key.toLowerCase();
      if (lowMod === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
      else if (lowMod === 'z' && e.shiftKey) { e.preventDefault(); redo(); }
      else if (lowMod === 'y') { e.preventDefault(); redo(); }
      return;
    }
    if (e.repeat) return;
    var low = key.toLowerCase();
    if (low === 'p') { setTool('pencil'); say('Pencil.'); }
    else if (low === 'f') { setTool('fill'); say('Fill.'); }
    else if (low === 'e') { setTool('eraser'); say('Eraser.'); }
    else if (low === 'i') { setTool('dropper'); say('Eyedropper.'); }
    else if (low === 'm') toggleMirror();
    else if (low === 'z') undo();
    else if (low === 'y') redo();
    else if (low === 'u') useIt();
    else if (key === '+' || key === '=') cycleZoom();
  });
})();
</script>
</body>
</html>
