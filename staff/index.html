<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#050814"/>
  <title>School links · The Tech Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root{color-scheme:dark;--bg:#050814;--panel:#0b152c;--elevated:#10203f;--border:#16324f;--text:#e8f7ff;--muted:#8fb4c9;--subtle:#5d7d96;--accent:#22d3ee;--live:#14b8a6}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Outfit,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    body{padding:1rem .8rem 2.5rem}
    .wrap{max-width:36rem;margin:0 auto}
    a{color:var(--accent)}
    h1{font-size:1.6rem;margin:.4rem 0 .3rem}
    p{color:var(--muted);line-height:1.45}
    label{display:flex;flex-direction:column;gap:.35rem;font-size:.85rem;font-weight:600;margin:0 0 .75rem}
    input,button{font:inherit}
    input{height:2.75rem;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:0 .9rem}
    input:focus{outline:2px solid var(--accent);outline-offset:2px}
    button{min-height:44px;border-radius:10px;border:0;padding:0 1rem;font-weight:650;cursor:pointer}
    .save{background:var(--accent);color:#041018}
    .ghost{background:var(--panel);color:var(--text);border:1px solid var(--border)}
    .card{background:var(--elevated);border:1px solid var(--border);border-radius:16px;padding:1rem;margin:1rem 0}
    .row{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.6rem 0;border-bottom:1px solid var(--border)}
    .row:last-child{border-bottom:0}
    .row-btns{display:flex;gap:.35rem;flex-shrink:0}
    .err{color:var(--muted);min-height:1.2rem}
    .chip{display:inline-flex;align-items:center;gap:.4rem;padding:.25rem .7rem;border-radius:999px;border:1px solid color-mix(in srgb,var(--accent) 24%,transparent);font-size:.72rem;font-weight:600;color:var(--muted)}
    .chip i{width:.45rem;height:.45rem;border-radius:50%;background:var(--live)}
  </style>
</head>
<body>
  <div class="wrap">
    <p class="chip"><i></i> Staff · school links</p>
    <h1>Included shortcuts</h1>
    <p>These tiles show on every Chromebook. Uses the same TechWorks Cloud desk key as tonight’s save. Names and https only — no roster.</p>
    <p><a href="/">← Tech Room door</a> · <a href="https://tw.kulibert.net/">Open TechWorks Admin → Door</a></p>

    <form class="card" id="key-form">
      <label>TechWorks desk key
        <input id="desk-key" type="text" autocomplete="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX"/>
      </label>
      <button class="save" type="submit">Unlock editor</button>
      <p class="err" id="key-status">Paste the Cloud desk key from TechWorks → Records → Cloud.</p>
    </form>

    <form class="card" id="note-form" hidden>
      <label>Door line
        <input id="note" maxlength="80" placeholder="This week: bring your sketch to period 3"/>
      </label>
      <button class="save" type="submit">Save door line</button>
    </form>

    <form class="card" id="add-form" hidden>
      <label>Name <input id="name" maxlength="24" placeholder="NYSED" required/></label>
      <label>Address <input id="href" placeholder="https://" required/></label>
      <button class="save" type="submit">Save to every Chromebook</button>
    </form>
    <p class="err" id="status"></p>
    <div class="card" id="list"></div>
  </div>
  <script>
    (function () {
      var API = "https://tw.kulibert.net/api/door-links";
      var links = [];
      var note = "";
      var token = "";

      function formatKey(raw) {
        return String(raw || "").replace(/[^a-z0-9]/gi, "").toUpperCase().slice(0, 12);
      }

      async function shaHex(s) {
        var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
        return Array.from(new Uint8Array(buf)).map(function (x) { return x.toString(16).padStart(2, "0"); }).join("");
      }

      async function deskToken(key) {
        return shaHex("techworks-desk-v1:" + key);
      }

      function hrefKey(href) {
        try {
          var url = new URL(href.includes("://") ? href : "https://" + href);
          var path = url.pathname.replace(/\/+$/, "");
          return (url.protocol + "//" + url.host.toLowerCase() + path + url.search).toLowerCase();
        } catch (e) {
          return String(href || "").replace(/\/+$/, "").toLowerCase();
        }
      }

      function when(iso) {
        if (!iso) return "";
        var d = new Date(iso);
        if (isNaN(d.getTime())) return "";
        return d.toLocaleString("en-US", { timeZone: "America/New_York", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
      }

      function paint() {
        var box = document.getElementById("list");
        box.innerHTML = "";
        if (!links.length) {
          box.textContent = "No school links yet.";
          return;
        }
        links.forEach(function (row, index) {
          var div = document.createElement("div");
          div.className = "row";
          var a = document.createElement("a");
          a.href = row.href;
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = row.name + " · " + row.href.replace(/^https?:\/\//, "");
          var btns = document.createElement("div");
          btns.className = "row-btns";
          function ghost(label, onClick, disabled) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "ghost";
            btn.textContent = label;
            btn.disabled = !!disabled;
            btn.addEventListener("click", onClick);
            return btn;
          }
          btns.appendChild(ghost("Up", function () { move(index, -1); }, index === 0));
          btns.appendChild(ghost("Down", function () { move(index, 1); }, index === links.length - 1));
          btns.appendChild(ghost("Remove", function () { save(links.filter(function (item) { return item.id !== row.id; }), note); }));
          div.appendChild(a);
          div.appendChild(btns);
          box.appendChild(div);
        });
      }

      function move(index, dir) {
        var next = links.slice();
        var swap = index + dir;
        if (swap < 0 || swap >= next.length) return;
        var tmp = next[index];
        next[index] = next[swap];
        next[swap] = tmp;
        save(next, note);
      }

      async function load() {
        var res = await fetch(API);
        var pack = await res.json();
        links = Array.isArray(pack.links) ? pack.links : [];
        note = typeof pack.note === "string" ? pack.note : "";
        document.getElementById("note").value = note;
        paint();
        var stamp = when(pack.updated);
        document.getElementById("status").textContent = links.length + " live on the door" + (stamp ? " · " + stamp : ".");
      }

      async function save(next, nextNote) {
        document.getElementById("status").textContent = "Saving…";
        var res = await fetch(API, {
          method: "PUT",
          headers: { "content-type": "application/json", "x-tw-desk": token },
          body: JSON.stringify({ keyHash: token, links: next, note: nextNote })
        });
        if (res.status === 401) {
          document.getElementById("status").textContent = "Desk key did not match TechWorks Cloud.";
          return;
        }
        if (!res.ok) {
          document.getElementById("status").textContent = "Save failed (" + res.status + "). Bind Cloud in TechWorks first.";
          return;
        }
        var pack = await res.json();
        links = Array.isArray(pack.links) ? pack.links : next;
        note = typeof pack.note === "string" ? pack.note : nextNote;
        document.getElementById("note").value = note;
        paint();
        var stamp = when(pack.updated);
        document.getElementById("status").textContent = (pack.n || links.length) + " live. Chromebooks refresh in about 40s" + (stamp ? " · " + stamp : ".");
      }

      document.getElementById("key-form").addEventListener("submit", async function (event) {
        event.preventDefault();
        var key = formatKey(document.getElementById("desk-key").value);
        if (key.length < 8) {
          document.getElementById("key-status").textContent = "Need the full Cloud desk key.";
          return;
        }
        token = await deskToken(key);
        document.getElementById("add-form").hidden = false;
        document.getElementById("note-form").hidden = false;
        document.getElementById("key-status").textContent = "Unlocked on this page only. Not stored on student machines.";
        load().catch(function () {
          document.getElementById("status").textContent = "Could not reach TechWorks.";
        });
      });

      document.getElementById("note-form").addEventListener("submit", function (event) {
        event.preventDefault();
        save(links, document.getElementById("note").value.replace(/\s+/g, " ").trim().slice(0, 80));
      });

      document.getElementById("add-form").addEventListener("submit", function (event) {
        event.preventDefault();
        var name = document.getElementById("name").value.replace(/\s+/g, " ").trim().slice(0, 24);
        var href = document.getElementById("href").value.trim();
        if (!name || !href) return;
        if (links.some(function (row) { return hrefKey(row.href) === hrefKey(href); })) {
          document.getElementById("status").textContent = "Already on the door.";
          return;
        }
        document.getElementById("name").value = "";
        document.getElementById("href").value = "";
        save(links.concat([{ id: "cut-" + Date.now().toString(36), name: name, href: href, icon: "school" }]), note);
      });

      load().catch(function () {});
    })();
  </script>
</body>
</html>
