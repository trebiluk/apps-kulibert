<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#050814"/>
<title>Drawin' · DS 0.3.0</title>
<link rel="stylesheet" href="/fonts/room.css"/>
<style>
  html, body { height: 100%; margin: 0; background: #050814; color: #e8f7ff; }
  body { font-family: Outfit, system-ui, sans-serif; }
  #chooser {
    min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1rem; padding: 1.2rem; text-align: center;
  }
  #chooser h1 { margin: 0; font-size: 2rem; }
  #chooser .rev { color: #8fb4c9; font-weight: 650; }
  #chooser p { margin: 0; font-size: 1.05rem; max-width: 28rem; }
  .pick { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; }
  .pick button {
    width: min(42vw, 220px); min-width: 140px; min-height: 140px;
    border-radius: 18px; border: 1px solid #24506d; background: #0b152c; color: #e8f7ff;
    font: 750 1.15rem/1.2 Outfit, system-ui, sans-serif; cursor: pointer;
  }
  .pick button span { display: block; font-size: 2.4rem; margin-bottom: .35rem; }
  #studio { display: none; height: 100%; }
  body.is-studio #chooser { display: none; }
  body.is-studio #studio { display: block; }
  iframe { width: 100%; height: 100%; border: 0; background: #111; }
</style>
</head>
<body>
<section id="chooser">
  <h1>Drawin'</h1>
  <div class="rev">DS 0.3.0</div>
  <p>Pick Vector for shapes or Paint for brushes.</p>
  <div class="pick">
    <button type="button" id="pick-vector"><span>◇</span>Vector</button>
    <button type="button" id="pick-paint"><span>🖌</span>Paint</button>
  </div>
</section>
<div id="studio">
  <iframe id="frame" title="Drawin' studio"></iframe>
</div>
<script src="/shared/kulibert-bar.js?v=2026-10-01-connected" data-app="drawin" data-version="DS 0.3.0" defer></script>
<script>
const frame = document.getElementById("frame");
function show(mode) {
  const next = mode === "paint" ? "paint" : "vector";
  frame.src = next === "paint" ? "./paint/" : "./vector/index.html?hub=1";
  document.body.classList.add("is-studio");
  try { localStorage.setItem("drawin-door", next); } catch (err) {}
}
document.getElementById("pick-vector").addEventListener("click", () => show("vector"));
document.getElementById("pick-paint").addEventListener("click", () => show("paint"));
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then((regs) => {
    for (const reg of regs) {
      if (reg.scope.endsWith("/drawin/")) reg.unregister();
    }
  });
}
</script>
</body>
</html>
