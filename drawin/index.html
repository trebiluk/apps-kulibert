<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#050814"/>
<title>Drawin' · DS 0.3.1</title>
<link rel="stylesheet" href="/fonts/room.css?v=2026-10-05-signin"/>
<style>
  html, body { height: 100%; margin: 0; background: #050814; color: #e8f7ff; }
  body { font-family: var(--kp-font), Outfit, "Noto Sans", "Noto Sans Arabic", "Noto Sans Ethiopic", system-ui, sans-serif; }
  html[data-kp-lang="ar"] body, html[data-kp-lang="fa-AF"] body, html[data-kp-lang="ti"] body { line-height: 1.55; }
  html[dir="rtl"] .kb-bar { direction: ltr; }
  #chooser {
    min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1rem; padding: 1.2rem; text-align: start;
  }
  #chooser h1 { margin: 0; font-size: 2rem; }
  #chooser .rev { color: #8fb4c9; font-weight: 650; }
  #chooser p { margin: 0; font-size: 1.05rem; max-width: 28rem; }
  .pick { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; }
  .pick button {
    width: min(42vw, 220px); min-width: 140px; min-height: 140px;
    border-radius: 18px; border: 1px solid #24506d; background: #0b152c; color: #e8f7ff;
    font: 750 1.15rem/1.2 var(--kp-font), Outfit, system-ui, sans-serif; cursor: pointer;
  }
  .pick button span { display: block; font-size: 2.4rem; margin-bottom: .35rem; }
  #studio { display: none; height: 100%; }
  body.is-studio #chooser { display: none; }
  body.is-studio #studio { display: block; }
  iframe { width: 100%; height: 100%; border: 0; background: #111; }
</style>
</head>
<body>
<section id="chooser">
  <h1><bdi>Drawin'</bdi></h1>
  <div class="rev">DS 0.3.1</div>
  <p id="ds-news">Drawin' tools have names in your language.</p>
  <p id="ds-blurb">Pick Vector for shapes or Paint for brushes.</p>
  <div class="pick">
    <button type="button" id="pick-vector"><span>◇</span>Vector</button>
    <button type="button" id="pick-paint"><span>🖌</span>Paint</button>
  </div>
</section>
<div id="studio">
  <iframe id="frame" title="Drawin' studio"></iframe>
</div>
<script src="/shared/kulibert-prefs.js?v=2026-10-05-signin"></script>
<script src="/shared/kulibert-i18n.js?v=2026-10-05-signin"></script>
<script src="./i18n.js?v=1"></script>
<script src="/shared/kulibert-bar.js?v=2026-10-05-signin" data-app="drawin" data-version="DS 0.3.1" data-rtl="1" defer></script>
<script>
const frame = document.getElementById("frame");
function langNow() {
  try {
    if (window.KulibertPrefs && KulibertPrefs.lang) return KulibertPrefs.lang;
  } catch (e) {}
  return document.documentElement.getAttribute("data-kp-lang") || "en";
}
function show(mode) {
  const next = mode === "paint" ? "paint" : "vector";
  const lang = encodeURIComponent(langNow());
  frame.src = next === "paint" ? "./paint/?lang=" + lang : "./vector/index.html?hub=1&lang=" + lang;
  document.body.classList.add("is-studio");
  try { localStorage.setItem("drawin-door", next); } catch (err) {}
}
function forward(lang) {
  if (!frame.src || !frame.contentWindow) return;
  try { frame.contentWindow.postMessage({ type: "kp-lang", lang: lang }, location.origin); } catch (e) {}
}
document.getElementById("pick-vector").addEventListener("click", () => show("vector"));
document.getElementById("pick-paint").addEventListener("click", () => show("paint"));
window.addEventListener("message", function (ev) {
  if (!ev.data || ev.data.type !== "kp-lang") return;
  if (window.DrawinPaintChooser) DrawinPaintChooser();
  forward(ev.data.lang);
});
window.addEventListener("kulibert-lang", function (ev) {
  if (window.DrawinPaintChooser) DrawinPaintChooser();
  forward(ev.detail && ev.detail.lang);
});
if (window.DrawinPaintChooser) DrawinPaintChooser();
if (window.KulibertI18n && KulibertI18n.ready) KulibertI18n.ready(null, function () {
  if (window.DrawinPaintChooser) DrawinPaintChooser();
});
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then((regs) => {
    for (const reg of regs) {
      if (reg.scope.endsWith("/drawin/")) reg.unregister();
    }
  });
}
</script>
</body>
</html>
