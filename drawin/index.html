<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#050814"/>
<title>Drawin' · DS 0.3.2</title>
<link rel="stylesheet" href="/fonts/room.css?v=2026-10-05-signin"/>
<style>
  html, body { height: 100%; margin: 0; background: #050814; color: #e8f7ff; }
  body { font-family: var(--kp-font), Outfit, "Noto Sans", "Noto Sans Arabic", "Noto Sans Ethiopic", system-ui, sans-serif; }
  html[data-kp-lang="ar"] body, html[data-kp-lang="fa-AF"] body, html[data-kp-lang="ti"] body { line-height: 1.55; }
  html[dir="rtl"] .kb-bar { direction: ltr; }
  #chooser {
    min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1rem; padding: 4.2rem 1.2rem 1.2rem; text-align: start;
  }
  #chooser h1 { margin: 0; font-size: 2rem; }
  #chooser .rev { color: #8fb4c9; font-weight: 650; }
  #chooser p { margin: 0; font-size: 1.05rem; max-width: 32rem; }
  #ds-news { padding: .7rem .9rem; border-radius: 14px; background: #0b152c; border: 1px solid #24506d; }
  .pick { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; }
  .pick a {
    width: min(42vw, 220px); min-width: 140px; min-height: 140px;
    border-radius: 18px; border: 1px solid #24506d; background: #0b152c; color: #e8f7ff;
    font: 750 1.15rem/1.2 var(--kp-font), Outfit, system-ui, sans-serif; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-decoration: none; text-align: center;
  }
  .pick a span { display: block; font-size: 2.4rem; margin-bottom: .35rem; }
  .ds-gear { margin-top: .2rem; }
</style>
</head>
<body>
<section id="chooser">
  <h1><bdi>Drawin'</bdi></h1>
  <div class="rev">DS 0.3.2</div>
  <p id="ds-news" role="status">DS 0.3.2: Vector and Paint open from the door. Tools are big enough to tap.</p>
  <p id="ds-blurb">Pick Vector for shapes or Paint for brushes.</p>
  <div class="pick">
    <a id="pick-vector" href="/drawin/vector/"><span aria-hidden="true">◇</span>Vector</a>
    <a id="pick-paint" href="/drawin/paint/"><span aria-hidden="true">🖌</span>Paint</a>
  </div>
  <button type="button" id="ds-settings" class="ds-gear"><span aria-hidden="true">⚙</span><span>My settings</span></button>
</section>
<script src="/shared/kulibert-prefs.js?v=2026-10-05-signin"></script>
<script src="/shared/kulibert-i18n.js?v=2026-10-05-signin"></script>
<script src="./i18n.js?v=2"></script>
<script src="/shared/kulibert-bar.js?v=2026-10-05-signin" data-app="drawin" data-version="DS 0.3.2" data-rtl="1" data-menu="#ds-nav" defer></script>
<script src="./chrome.js?v=2" defer></script>
<script>
function withLang(anchor) {
  try {
    var lang = (window.KulibertPrefs && KulibertPrefs.lang) || document.documentElement.getAttribute("data-kp-lang") || "en";
    var url = new URL(anchor.getAttribute("href"), location.href);
    url.searchParams.set("lang", lang);
    anchor.href = url.pathname + url.search;
  } catch (e) {}
}
document.querySelectorAll(".pick a").forEach(function (a) {
  a.addEventListener("click", function () { withLang(a); });
});
window.addEventListener("kulibert-lang", function () {
  if (window.DrawinPaintChooser) DrawinPaintChooser();
});
if (window.DrawinPaintChooser) DrawinPaintChooser();
if (window.KulibertI18n && KulibertI18n.ready) KulibertI18n.ready(null, function () {
  if (window.DrawinPaintChooser) DrawinPaintChooser();
});
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then(function (regs) {
    for (var i = 0; i < regs.length; i++) {
      if (regs[i].scope.endsWith("/drawin/")) regs[i].unregister();
    }
  });
}
</script>
</body>
</html>
