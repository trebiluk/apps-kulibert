<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#161513"/>
<title>Drawin'</title>
<style>
@font-face {
  font-family: "Drawin Sans";
  src: url("./vector/fonts/source-sans-3-600.woff2") format("woff2");
  font-weight: 600;
  font-display: swap;
}
@font-face {
  font-family: "Drawin Serif";
  src: url("./vector/fonts/source-serif-4-600.woff2") format("woff2");
  font-weight: 600;
  font-display: swap;
}
html, body { height: 100%; margin: 0; background: #161513; color: #f3efe6; }
body {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  min-height: 0;
  overflow: hidden;
  font: 14px/1.4 "Drawin Sans", "Segoe UI", sans-serif;
}
header {
  display: flex; align-items: center; gap: 14px;
  min-height: 48px; padding: 0 14px;
  border-bottom: 1px solid rgba(243, 239, 230, 0.08);
  background: #1c1b18;
}
.brand {
  font-family: "Drawin Serif", Georgia, serif;
  font-size: 22px;
  letter-spacing: -0.03em;
  white-space: nowrap;
}
nav { display: flex; gap: 4px; }
button {
  min-height: 32px; padding: 0 14px; border-radius: 999px;
  border: 0; background: transparent; color: #a39c90;
  font: inherit; cursor: pointer; letter-spacing: 0.01em;
  box-shadow: inset 0 0 0 1px rgba(243, 239, 230, 0.1);
}
button[aria-pressed="true"] {
  background: #d08a2d; color: #161513;
  font-weight: 600;
  box-shadow: inset 0 1px 0 rgba(255, 248, 230, 0.4);
}
iframe { width: 100%; height: 100%; min-height: 0; border: 0; background: #161513; display: block; }
@media (max-height: 520px) {
  header { min-height: 40px; padding: 0 10px; gap: 8px; }
  .brand { font-size: 18px; }
  button { min-height: 28px; padding: 0 12px; }
}
</style>
</head>
<body>
<header>
  <div class="brand">Drawin'</div>
  <nav aria-label="Studio">
    <button type="button" id="tab-vector" aria-pressed="true">Vector</button>
    <button type="button" id="tab-paint" aria-pressed="false">Paint</button>
  </nav>
</header>
<iframe id="frame" title="Drawin' studio" src="./vector/index.html?hub=1"></iframe>
<script>
const KEY = "drawin-door";
const frame = document.getElementById("frame");
const tabs = {
  vector: document.getElementById("tab-vector"),
  paint: document.getElementById("tab-paint"),
};
function show(mode) {
  const next = mode === "paint" ? "paint" : "vector";
  frame.src = next === "paint" ? "./paint/" : "./vector/index.html?hub=1";
  tabs.vector.setAttribute("aria-pressed", next === "vector" ? "true" : "false");
  tabs.paint.setAttribute("aria-pressed", next === "paint" ? "true" : "false");
  try { localStorage.setItem(KEY, next); } catch (err) { /* private mode */ }
}
tabs.vector.addEventListener("click", () => show("vector"));
tabs.paint.addEventListener("click", () => show("paint"));
try {
  if (localStorage.getItem(KEY) === "paint") show("paint");
} catch (err) { /* private mode */ }
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then((regs) => {
    for (const reg of regs) {
      if (reg.scope.endsWith("/drawin/")) reg.unregister();
    }
  });
}
</script>
</body>
</html>
