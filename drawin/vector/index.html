<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#161513" />
    <title>Drawin' Vector</title>
    <link rel="stylesheet" href="./studio.css?v=7" />
  </head>
  <body class="panel-open">
    <div id="app">
      <header id="bar">
        <div class="brand">Drawin' <em>Vector</em></div>
        <nav id="menus" aria-label="Commands"></nav>
        <button type="button" id="panel-toggle" aria-pressed="true">Style</button>
        <label class="docname">
          <span class="sr">Document name</span>
          <input id="doc-name" maxlength="48" autocomplete="off" spellcheck="false" />
        </label>
        <a id="paint-link" hidden href="/drawin/paint/">Paint</a>
      </header>
      <div id="tools" role="toolbar" aria-label="Tools"></div>
      <div id="stage-wrap">
        <div id="ruler-corner" title="Drag guides back here to remove them"></div>
        <canvas id="ruler-x" height="22"></canvas>
        <canvas id="ruler-y" width="22"></canvas>
        <div id="stage">
          <svg id="svg" xmlns="http://www.w3.org/2000/svg">
            <defs id="defs"></defs>
            <g id="world">
              <g id="page"></g>
              <g id="content"></g>
              <g id="overlay"></g>
            </g>
          </svg>
          <p id="empty">Blank page<span>Pen, a shape, or drop an SVG.</span></p>
        </div>
      </div>
      <aside id="inspector" aria-label="Properties"></aside>
      <footer id="status">
        <span id="hint"></span>
        <span id="coords"></span>
      </footer>
    </div>
    <div id="menu" hidden role="menu"></div>
    <div id="dialog" hidden>
      <form id="dialog-form">
        <h2 id="dialog-title"></h2>
        <div id="dialog-body"></div>
        <div class="dialog-actions">
          <button type="button" id="dialog-cancel">Cancel</button>
          <button type="submit" id="dialog-ok">OK</button>
        </div>
      </form>
    </div>
    <script src="/shared/kw-who.js?v=2026-09-29-hub-return"></script>
    <script src="./vendor/paper-full.min.js"></script>
    <script src="./vendor/opentype.min.js"></script>
    <script type="module" src="./studio.js?v=7"></script>
  </body>
</html>
