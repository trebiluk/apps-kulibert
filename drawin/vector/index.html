<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#161513" />
    <title>Drawin' Vector</title>
    <link rel="stylesheet" href="/fonts/room.css?v=2026-10-05-signin" />
    <link rel="stylesheet" href="./studio.css?v=8" />
    <style>
      body{font-family:var(--kp-font),Outfit,"Noto Sans","Noto Sans Arabic","Noto Sans Ethiopic",system-ui,sans-serif}
      html[data-kp-lang="ar"] body,html[data-kp-lang="fa-AF"] body,html[data-kp-lang="ti"] body{line-height:1.55}
      #bar,#tools,#inspector{background:#050814}
      #ds-prompt{margin:0;padding:.35rem .7rem;background:#0b152c;color:#e8f7ff;font:650 .9rem/1.3 Outfit,system-ui,sans-serif}
      #ds-help{position:fixed;left:8px;bottom:8px;z-index:5;min-width:44px;min-height:44px;border-radius:999px;border:1px solid #24506d;background:#0b152c;color:#e8f7ff}
      #ds-tips[hidden]{display:none}
      #ds-tips{position:fixed;left:8px;bottom:60px;z-index:5;background:#0b152c;color:#e8f7ff;padding:.6rem .8rem;border-radius:12px;max-width:16rem}
    </style>
  </head>
  <body class="panel-open">
    <p id="ds-prompt">Draw a robot face. Tap Save when done.</p>
    <div id="ds-tips" hidden>
      <p>1. Pick a brush.</p>
      <p>2. Draw on the page.</p>
      <p>3. Tap Save.</p>
    </div>
    <button type="button" id="ds-help" aria-label="Help">?</button>
    <p class="ds-ar" lang="ar" dir="rtl" hidden>ارسم وجهاً. ثم احفظ.</p>
    <div id="app">
      <header id="bar">
    <div class="brand"><bdi>Drawin'</bdi> <em>Vector</em></div>
        <nav id="menus" aria-label="Commands"></nav>
        <button type="button" id="panel-toggle" aria-pressed="true">Style</button>
        <label class="docname">
          <span class="sr">Document name</span>
          <input id="doc-name" maxlength="48" autocomplete="off" spellcheck="false" />
        </label>
        <a id="paint-link" hidden href="/drawin/paint/">Paint</a>
      </header>
      <div id="tools" role="toolbar" aria-label="Tools"></div>
      <div id="stage-wrap">
        <div id="ruler-corner" title="Drag guides back here to remove them"></div>
        <canvas id="ruler-x" height="22"></canvas>
        <canvas id="ruler-y" width="22"></canvas>
        <div id="stage">
          <svg id="svg" xmlns="http://www.w3.org/2000/svg">
            <defs id="defs"></defs>
            <g id="world">
              <g id="page"></g>
              <g id="content"></g>
              <g id="overlay"></g>
            </g>
          </svg>
          <p id="empty">Blank page<span>Pen, a shape, or drop an SVG.</span></p>
        </div>
      </div>
      <aside id="inspector" aria-label="Properties"></aside>
      <footer id="status">
        <span id="hint" role="status"></span>
        <span id="coords"></span>
      </footer>
    </div>
    <div id="menu" hidden role="menu"></div>
    <div id="dialog" hidden>
      <form id="dialog-form">
        <h2 id="dialog-title"></h2>
        <div id="dialog-body"></div>
        <div class="dialog-actions">
          <button type="button" id="dialog-cancel">Cancel</button>
          <button type="submit" id="dialog-ok">OK</button>
        </div>
      </form>
    </div>
    <script src="/shared/kulibert-prefs.js?v=2026-10-05-signin"></script>
    <script src="/shared/kulibert-i18n.js?v=2026-10-05-signin"></script>
    <script src="/shared/kulibert-bar.js?v=2026-10-07-polish" data-app="drawin" data-version="DS 0.3.3" data-rtl="1" data-help="#ds-help" data-menu="#ds-nav" defer></script>
    <script src="../i18n.js?v=3"></script>
    <script src="../chrome.js?v=3" defer></script>
    <script src="/shared/kw-who.js?v=2026-10-01-v2"></script>
    <script src="./vendor/paper-full.min.js"></script>
    <script src="./vendor/opentype.min.js"></script>
    <script type="module" src="./studio.js?v=8"></script>
    <script>
      document.getElementById("ds-help").addEventListener("click", function () {
        var tips = document.getElementById("ds-tips");
        tips.hidden = !tips.hidden;
      });
      if (window.KulibertBar) KulibertBar.setHelp(function () {
        document.getElementById("ds-help").click();
      });
    </script>
  </body>
</html>
