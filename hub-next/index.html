<meta name="robots" content="noindex">
<link rel="icon" href="/icons/icon-kulinet-k.svg" type="image/svg+xml">

<style>
@font-face{font-family:"Outfit";font-weight:100 900;font-display:swap;src:url("https://apps.kulibert.net/fonts/outfit-latin-wght.woff2") format("woff2")}
/* Tech Room lock: bg #050814 · cards #0B1220 · labels #F7F9FF · cyan #22D3EE. Cerulean #38BDF8 for the second accent. */
/* Color rule (Diego, Oct 2): teal and cyan first, then blue. Purple only for the TechWorks logo and Berty accents. */
:root,html[data-look=room]{
  --bg:#050814;--card:#0b1220;--card-hi:#111b30;--text:#f7f9ff;--muted:#b9c6dd;
  --teal:#2dd4bf;--teal-hi:#5eead4;--ink-on-teal:#04201c;--cyan:#22d3ee;--blue:#60a5fa;
  --top:#070c1c;--panel:#0a1122;--field:#050814;--hold:#9fb0cc;
  --line:color-mix(in srgb,#22d3ee 30%,#0b1220);--line-soft:#1b2944;
  --tw-bg:#0b2833;--tw-line:#1f7f96;--tw-text:#d5f8ff;--picked:#0b2a2c;
  --r:16px;--tap:48px;--bar:60px;color-scheme:dark;
}
html[data-look=space]{--bg:#02040a;--card:#0a0f1f;--card-hi:#101a33;--text:#f2f6ff;--muted:#b4c2dc;--teal:#22d3ee;--teal-hi:#67e8f9;--ink-on-teal:#031820;--cyan:#22d3ee;--blue:#7cb4ff;--top:#04060f;--panel:#070b18;--field:#02040a;--line:#1d3a5c;--line-soft:#14213a;--picked:#0a2533}
html[data-look=spa]{--bg:#03110f;--card:#08201d;--card-hi:#0c2b27;--text:#effffb;--muted:#b4d6cf;--teal:#5eead4;--teal-hi:#99f6e4;--ink-on-teal:#032420;--cyan:#67e8f9;--blue:#7dd3fc;--top:#041613;--panel:#061b18;--field:#03110f;--line:#1c5a52;--line-soft:#123a35;--tw-bg:#0a3230;--tw-line:#2a8f86;--tw-text:#dcfffa;--picked:#0c3a35;--hold:#9cc4bd}
html[data-look=graph]{--bg:#eef4f8;--card:#ffffff;--card-hi:#f3fbfb;--text:#0b1626;--muted:#33475e;--teal:#0f766e;--teal-hi:#115e59;--ink-on-teal:#ffffff;--cyan:#0e7490;--blue:#1d4ed8;--top:#ffffff;--panel:#f7fafc;--field:#ffffff;--line:#8fb8c4;--line-soft:#cfdde6;--tw-bg:#e3f6fa;--tw-line:#5aa9bd;--tw-text:#0b3a47;--picked:#dff3f1;--hold:#4d6075;color-scheme:light}
html[data-look=berty]{--bg:#150e09;--card:#24180f;--card-hi:#2f2015;--text:#fff4e8;--muted:#e3cbb2;--teal:#2dd4bf;--teal-hi:#5eead4;--ink-on-teal:#04201c;--cyan:#22d3ee;--blue:#c084fc;--top:#1b120b;--panel:#1b120b;--field:#150e09;--line:#5a3f2a;--line-soft:#3a291c;--tw-bg:#2a1f33;--tw-line:#8b5cf6;--tw-text:#f3e8ff;--picked:#2f2a1c;--hold:#c7ad93}
html[data-look=contrast]{--bg:#000000;--card:#000000;--card-hi:#0a0a0a;--text:#ffffff;--muted:#ffffff;--teal:#5eead4;--teal-hi:#99f6e4;--ink-on-teal:#000000;--cyan:#67e8f9;--blue:#93c5fd;--top:#000000;--panel:#000000;--field:#000000;--line:#ffffff;--line-soft:#ffffff;--tw-bg:#000000;--tw-line:#ffffff;--tw-text:#ffffff;--picked:#003b36;--hold:#d9d9d9}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:500 18px/1.4 "Outfit",system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans Arabic","Noto Sans Ethiopic",sans-serif;min-height:100vh;min-height:100dvh}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Top bar: ☰ stays top-left in every language, so the bar itself is always LTR. */
.top{position:sticky;top:0;z-index:20;direction:ltr;display:flex;align-items:center;gap:10px;height:var(--bar);padding:0 12px;background:var(--top);border-bottom:1px solid var(--line-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);min-width:var(--tap);padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:18px;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--card-hi)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--ink-on-teal)}
.btn.primary:hover{background:var(--teal-hi);border-color:var(--teal-hi)}
.menu-btn .bars{font-size:22px;line-height:1}
.title{flex:1 1 auto;min-width:0;text-align:center;font-weight:800;font-size:20px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sign{white-space:nowrap}
html[dir=rtl] .sign{direction:rtl}
.title .the{display:inline}
@media (max-width:479px){.title .the{display:none}.title{font-size:18px}.top .btn{padding:0 12px}}
html[dir=rtl] .eyebrow,html[dir=rtl] .drawer h3{letter-spacing:0}

main{max-width:1280px;margin:0 auto;padding:16px 14px 32px}

/* Continue card */
.cont{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"icon text" "go go";gap:14px 16px;align-items:center;padding:18px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.cont img{grid-area:icon;width:88px;height:88px;border-radius:20px;display:block}
.cont .text{grid-area:text;min-width:0}
.eyebrow{margin:0;font-size:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
.cont h2{margin:2px 0 2px;font-size:28px;line-height:1.15;font-weight:800}
.cont p{margin:0;color:var(--muted);font-size:18px}
.cont .go{grid-area:go;min-height:60px;font-size:22px;width:100%;border-radius:14px}
@media (min-width:640px){
  .cont{grid-template-columns:auto 1fr auto;grid-template-areas:"icon text go"}
  .cont .go{width:auto;min-width:200px}
}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 4px}
.chip{flex:0 0 auto;min-height:var(--tap);padding:0 20px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:18px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:var(--ink-on-teal)}
.count{margin:10px 0 12px;color:var(--muted);font-size:16px}

/* App list: 1 column on phones, 2 at Chromebook/landscape widths, 3 at 1366, 4 on very wide screens */
.apps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.apps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1200px){.apps{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1560px){.apps{grid-template-columns:repeat(4,minmax(0,1fr))}}
.row{display:flex;align-items:center;gap:16px;min-height:100px;padding:14px 16px;border-radius:var(--r);background:var(--card);border:1px solid var(--line-soft);text-decoration:none}
.row:hover{border-color:var(--cyan);background:var(--card-hi)}
.row img{flex:0 0 auto;width:68px;height:68px;border-radius:16px;display:block}
.row .info{min-width:0;flex:1 1 auto}
.row .name{display:block;font-size:22px;font-weight:800;line-height:1.2}
.row .tag{display:block;font-size:18px;color:var(--muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tw{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:3px 10px 3px 6px;border-radius:999px;background:var(--tw-bg);border:1px solid var(--tw-line);color:var(--tw-text);font-size:16px;font-weight:700}
.tw img{width:20px;height:20px;border-radius:4px}
.empty{padding:24px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted)}

/* Footer: version plate + What's new */
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-top:28px;padding:16px;border-radius:var(--r);background:var(--top);border:1px solid var(--line-soft);font-size:16px;color:var(--muted)}
.plate{font-weight:700;color:var(--text)}

/* Left drawer (left in every language) */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(2,4,10,.72)}
.drawer{position:fixed;z-index:40;top:0;bottom:0;left:0;width:min(360px,90vw);overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:12px 14px 24px;box-shadow:12px 0 32px rgba(0,0,0,.5)}
.scrim[hidden],.drawer[hidden]{display:none}
.drawer-head{position:sticky;top:-12px;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-12px -14px 10px;padding:12px 14px 10px;background:var(--panel);border-bottom:1px solid var(--line-soft)}
.drawer-head h2{margin:0;font-size:22px}
.drawer h3{margin:20px 0 8px;font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
.drawer .list{display:grid;gap:8px}
.drawer .list .btn{justify-content:flex-start;width:100%}
.drawer .list .btn[aria-pressed=true]{border-color:var(--teal);background:var(--picked)}
.search{width:100%;min-height:52px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--text);font:inherit;font-size:18px}
.search::placeholder{color:var(--hold);opacity:1}
.news{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.news li{padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line-soft);font-size:18px}
.news b{display:block;color:var(--cyan);font-size:16px}
.look{display:flex;align-items:center;gap:12px}.look i{flex:0 0 auto;width:28px;height:28px;border-radius:8px;border:2px solid var(--line)}
.proto{margin-top:20px;font-size:16px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.row,.btn,.chip{transition:background-color .12s,border-color .12s}}
@media (max-height:500px){.cont{padding:12px 16px}.cont img{width:68px;height:68px}.cont h2{font-size:24px}.cont .go{min-height:52px}.chips{margin-top:14px}}
</style>
</head>

<header class="top">
  <button type="button" class="btn menu-btn" id="menu-btn" aria-controls="drawer" aria-expanded="false"><span class="bars" aria-hidden="true">☰</span><span data-t="menu">Menu</span></button>
  <div class="title" dir="ltr"><span class="the">The </span>Tech Room</div>
  <a class="btn sign" id="sign" href="/" data-t="signIn">Sign in</a>
</header>

<main>
  <section class="cont" id="cont" aria-labelledby="cont-name">
    <img id="cont-icon" alt="" width="88" height="88">
    <div class="text">
      <p class="eyebrow" data-t="continue">Continue</p>
      <h2 id="cont-name">Drift</h2>
      <p id="cont-tag"></p>
    </div>
    <a class="btn primary go" id="cont-go" href="#"><span data-t="start">Start</span></a>
  </section>

  <nav class="chips" id="chips" aria-label="Categories"></nav>
  <p class="count" id="count" aria-live="polite"></p>
  <ul class="apps" id="apps"></ul>

  <footer class="foot">
    <span><span class="plate" id="plate"></span></span>
    <button type="button" class="btn" id="news-btn" data-t="whatsNew">What's new</button>
  </footer>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-labelledby="drawer-title">
  <div class="drawer-head"><h2 id="drawer-title" data-t="menu">Menu</h2><button type="button" class="btn" id="close-btn" data-t="close">Close</button></div>
  <label class="sr" for="search" data-t="searchLabel">Search apps</label>
  <input class="search" id="search" type="search" autocomplete="off">
  <h3 data-t="language">Language</h3>
  <div class="list" id="langs"></div>
  <h3 data-t="myStyle">My style</h3>
  <div class="list" id="looks"></div>
  <h3 id="news-title" data-t="whatsNew">What's new</h3>
  <ul class="news" id="news"></ul>
  <h3 data-t="more">More</h3>
  <div class="list">
    <a class="btn" href="/" data-t="liveHub">Today's Tech Room</a>
    <a class="btn" href="/?hub=classic" data-t="classicHub">Classic Tech Room</a>
  </div>
  <p class="proto" data-t="protoNote">Prototype. Links open the real apps.</p>
</aside>

    $("search").placeholder=t("searchHint");
    $("plate").textContent=VERSION+" · rev 2026-10-12-one-menu";
    $("chips").setAttribute("aria-label",t("categories"));
  }
  function paintContinue(){
    var a=lastApp();$("cont-icon").src=ICON[a.icon];$("cont-name").textContent=a.name;$("cont-tag").textContent=tag(a);
    $("cont-go").href=a.href;$("cont-go").setAttribute("aria-label",t("start")+": "+a.name);
    $("cont-go").onclick=function(){remember(a.id)};
  }
  function paintChips(){
    var box=$("chips");box.innerHTML="";
    ["all"].concat(CATS).forEach(function(c){var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=t("cat_"+c);b.setAttribute("aria-pressed",c===cat?"true":"false");
      b.onclick=function(){cat=c;var u=new URL(location.href);if(c==="all")u.searchParams.delete("cat");else u.searchParams.set("cat",c);history.replaceState(null,"",u);paintChips();paintList()};box.appendChild(b)});
  }
  function paintList(){
    var ul=$("apps");ul.innerHTML="";
    var s=term.trim().toLowerCase();
    var list=APPS.filter(function(a){return (cat==="all"||a.cat===cat)&&(!s||(a.name+" "+tag(a)+" "+a.kw).toLowerCase().indexOf(s)>=0)});
    list.forEach(function(a){
      var li=document.createElement("li");
      var el=document.createElement("a");el.className="row";el.href=a.href;el.onclick=function(){remember(a.id)};
      var img=document.createElement("img");img.src=ICON[a.icon];img.alt="";img.width=68;img.height=68;img.loading="lazy";el.appendChild(img);
      var info=document.createElement("span");info.className="info";
      var n=document.createElement("span");n.className="name";n.textContent=a.name;n.dir="auto";info.appendChild(n);
      var g=document.createElement("span");g.className="tag";g.textContent=tag(a);info.appendChild(g);
      if(a.tw){var b=document.createElement("span");b.className="tw";b.innerHTML='<img alt="" src="'+ICON["tw"]+'">';var w=document.createElement("span");w.textContent=t("twConnected");b.appendChild(w);b.title=t("twTitle");info.appendChild(b)}
      el.appendChild(info);li.appendChild(el);ul.appendChild(li)});
    if(!list.length){var e=document.createElement("li");e.className="empty";e.textContent=t("nothingMatches");ul.appendChild(e)}
    $("count").textContent=t("appsShown").replace("{n}",list.length);
  }
  function paintDrawer(){
    var box=$("langs");box.innerHTML="";
    LANGS.forEach(function(p){var b=document.createElement("button");b.type="button";b.className="btn";b.lang=p[0];b.textContent=p[1];b.setAttribute("aria-pressed",p[0]===lang?"true":"false");
      b.onclick=function(){lang=p[0];try{localStorage.setItem("hub-next-lang",lang)}catch(e){}var u=new URL(location.href);u.searchParams.set("lang",lang);history.replaceState(null,"",u);all()};box.appendChild(b)});
    var lk=$("looks");lk.innerHTML="";
    LOOKS.forEach(function(l){var b=document.createElement("button");b.type="button";b.className="btn look";b.setAttribute("aria-pressed",l[0]===look?"true":"false");var sw=document.createElement("i");sw.setAttribute("aria-hidden","true");sw.style.background="linear-gradient(135deg,"+l[3]+" 50%,"+l[2]+" 50%)";b.appendChild(sw);var w=document.createElement("span");w.textContent=t(l[1]);b.appendChild(w);
      b.onclick=function(){look=l[0];try{localStorage.setItem("hub-next-look",look)}catch(e){}var u=new URL(location.href);u.searchParams.set("look",look);history.replaceState(null,"",u);all();var again=document.querySelector("#looks [aria-pressed=true]");if(again)again.focus()};lk.appendChild(b)});
    var ul=$("news");ul.innerHTML="";
    NEWS.forEach(function(n){var li=document.createElement("li");var b=document.createElement("b");b.textContent=n.v;li.appendChild(b);li.appendChild(document.createTextNode(t(n.k)));ul.appendChild(li)});
  }
  function all(){paintStatic();paintContinue();paintChips();paintList();paintDrawer()}
  var lastFocus=null;
  function openDrawer(focusNews){lastFocus=document.activeElement;$("drawer").hidden=false;$("scrim").hidden=false;$("menu-btn").setAttribute("aria-expanded","true");
    if(focusNews){$("news-title").scrollIntoView({block:"start"})}else{$("drawer").scrollTop=0}$("close-btn").focus()}
  function closeDrawer(){$("drawer").hidden=true;$("scrim").hidden=true;$("menu-btn").setAttribute("aria-expanded","false");if(lastFocus&&lastFocus.focus)lastFocus.focus()}
  $("menu-btn").onclick=function(){$("drawer").hidden?openDrawer(false):closeDrawer()};
  $("close-btn").onclick=closeDrawer;$("scrim").onclick=closeDrawer;
  $("news-btn").onclick=function(){openDrawer(true)};
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("drawer").hidden)closeDrawer()});
  $("search").addEventListener("input",function(){term=this.value;paintList()});
  all();
  if(q.get("menu")==="1")openDrawer(false);
})();
</script>
</body>
</html>
