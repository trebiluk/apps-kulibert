<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#050814"/>
  <meta name="description" content="Spire Lab — stack a tower, see if it stands, read the caption."/>
  <title>Spire Lab · The Tech Room</title>
  <link rel="icon" href="/icons/icon-spire-lab.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="/fonts/room.css"/>
  <link rel="stylesheet" href="./styles.css"/>
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="brand" href="/">
        <img src="/icons/icon-spire-lab.svg" width="40" height="40" alt=""/>
        <span>
          <h1>Spire Lab</h1>
          <p>Stand prove</p>
        </span>
      </a>
      <div class="top-actions">
        <button type="button" id="assist" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/></svg>
          Assist
        </button>
        <button type="button" id="retry">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          Retry
        </button>
        <a href="/">Room</a>
      </div>
    </header>

    <p class="caption" id="caption" role="status" aria-live="polite" aria-atomic="true">
      <strong id="cap-word">Ready</strong>
      <span id="cap-text">Stack blocks up to the stand line. Then press Test.</span>
    </p>

    <div class="kinds" id="kinds" role="radiogroup" aria-label="Part">
      <button type="button" role="radio" data-kind="block" aria-checked="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
        Block
      </button>
      <button type="button" role="radio" data-kind="column" aria-checked="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="2" width="8" height="20" rx="2"/></svg>
        Column
      </button>
    </div>

    <nav class="pocket" aria-label="Tools">
      <button type="button" id="tool-add" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Add
      </button>
      <button type="button" id="tool-move" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M8 7l4-4 4 4M8 17l4 4 4-4M7 8 3 12l4 4M17 8l4 4-4 4"/></svg>
        Move
      </button>
      <button type="button" id="tool-delete" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V5h6v2M8 7l1 13h6l1-13"/></svg>
        Delete
      </button>
      <button type="button" id="tool-test" class="go">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V8M8 12l4-4 4 4M5 20h14"/></svg>
        Test
      </button>
    </nav>

    <div class="stage">
      <canvas id="board" tabindex="0" aria-label="Tower. Arrows pick a column. Enter uses the tool."></canvas>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
