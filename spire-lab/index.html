<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#050814"/>
  <meta name="spire-rev" content="2026-09-22-sl-1.1.0"/>
  <meta name="description" content="Spire Lab — drop a slab, keep the overlap, read the height."/>
  <title>Spire Lab · The Tech Room</title>
  <link rel="icon" href="/icons/icon-spire-lab.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="/fonts/room.css"/>
  <link rel="stylesheet" href="./styles.css"/>
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="brand" href="/">
        <img src="/icons/icon-spire-lab.svg" width="40" height="40" alt=""/>
        <span>
          <h1>Spire Lab</h1>
          <p>SL 1.1.0</p>
        </span>
      </a>
      <div class="top-actions">
        <button type="button" id="assist" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/></svg>
          Assist
        </button>
        <button type="button" id="retry" class="fat">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          Retry
        </button>
        <a href="/">Room</a>
      </div>
    </header>

    <p class="caption" id="caption" role="status" aria-live="polite" aria-atomic="true">
      <strong id="cap-word">Ready</strong>
      <span id="cap-mark" aria-hidden="true"></span>
      <span id="cap-text">Drop the slab. Height is how many stay standing.</span>
    </p>

    <div class="kinds" id="kinds">
      <p id="height-read">Height <strong id="height-n">0</strong></p>
      <p id="streak" hidden>Streak <strong id="streak-n">0</strong></p>
    </div>

    <nav class="pocket" aria-label="Tools">
      <button type="button" id="tool-test" class="go">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10M8 10l4 4 4-4M6 20h12"/></svg>
        Drop
      </button>
    </nav>

    <div class="stage">
      <canvas id="board" tabindex="0" aria-label="Tower. Drag the grip or press Drop. Height is the floors that stay standing."></canvas>
    </div>
    <div class="edge-pocket">
      <button type="button" id="edge-btn" aria-expanded="false" aria-controls="edge-menu">More</button>
      <div id="edge-menu" hidden>
        <a href="/">Room</a>
        <a href="./changelog.html">For class</a>
      </div>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
