<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E8A92">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sprocket">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>Sprocket</title>
  <link rel="stylesheet" href="/fonts/room.css?v=2026-10-05-signin">
  <link rel="stylesheet" href="./styles.css?v=1.5.1">
  <script src="/shared/kulibert-prefs.js?v=2026-10-05-signin"></script>
  <script src="/shared/kulibert-i18n.js?v=2026-10-05-signin"></script>
</head>
<body class="dark">
  <a class="sr" href="#app">Skip to tools</a>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true">
        <ellipse cx="32" cy="34" rx="22" ry="16" fill="#E6F8F9"/>
        <circle cx="23" cy="33" r="8.2" fill="#fff"/>
        <circle cx="41" cy="33" r="8.2" fill="#fff"/>
        <circle cx="23" cy="33" r="5.4" fill="#FFC130"/>
        <circle cx="41" cy="33" r="5.4" fill="#FFC130"/>
        <circle cx="24.6" cy="32.2" r="2.4" fill="#343B45"/>
        <circle cx="42.6" cy="32.2" r="2.4" fill="#343B45"/>
        <path d="M26 42c2.2 2.4 9.8 2.4 12 0" fill="none" stroke="#343B45" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <bdi>Sprocket</bdi>
      <span class="verchip">1.5.1</span>
    </div>
    <div class="tools">
      <button type="button" id="dark-btn">Light</button>
      <button type="button" id="mode-btn" aria-pressed="false">Big type</button>
    </div>
  </header>
  <main id="app"></main>
  <nav class="nav" aria-label="Sprocket tabs">
    <button type="button" class="on" data-tab="home" aria-current="page"><span>⌂</span>Home</button>
    <button type="button" data-tab="convert"><span>↔</span>Convert</button>
    <button type="button" data-tab="stock"><span>■</span>Stock</button>
    <button type="button" data-tab="timers"><span>⏱</span>Timers</button>
    <button type="button" data-tab="help"><span>?</span>Help</button>
    <button type="button" data-tab="more"><span>⚙</span>More</button>
  </nav>
  <script src="./lang.js?v=1.5.1"></script>
  <script src="/shared/kulibert-bar.js?v=2026-10-05-plate" data-app="sprocket" data-name="Sprocket" data-version="1.5.1" data-rtl="1" defer></script>
  <script>
  let ends=0;
  let tab="home";
  function show(name){
    tab=name;
    document.querySelectorAll(".nav button").forEach(b=>{
      const on=b.dataset.tab===name;
      b.classList.toggle("on", on);
      if(on) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
    });
    document.getElementById("app").innerHTML=SprocketI18n.view(name);
    SprocketI18n.paintNav();
    document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>show(b.dataset.tab));
    if(name==="convert"){
      const run=()=>{
        const mm=Number(document.getElementById("mm").value);
        document.getElementById("mmout").textContent=mm+" mm  ·  "+(mm/25.4).toFixed(2)+" in";
        const c=Number(document.getElementById("c").value);
        document.getElementById("cout").textContent=c+" C  =  "+(c*9/5+32).toFixed(1)+" F";
      };
      document.getElementById("mm").oninput=run;
      document.getElementById("c").oninput=run;
      run();
    }
    if(name==="timers"){
      document.querySelectorAll("[data-min]").forEach(b=>b.onclick=()=>{
        ends=Date.now()+Number(b.dataset.min)*60000;
        document.getElementById("tlab").textContent=b.textContent;
      });
    }
    if(name==="home" && window.KulibertPrefs && KulibertPrefs.get().read){
      KulibertPrefs.say(SprocketI18n.tx("nowDo"));
    }
  }
  function tick(){
    const el=document.getElementById("tclk");
    if(!el||!ends) return;
    const s=Math.max(0,Math.floor((ends-Date.now())/1000));
    if(s===0){
      const word=SprocketI18n.doneWord();
      el.textContent=word+" ✓";
      el.classList.add("is-done");
      const lab=document.getElementById("tlab");
      if(lab) lab.textContent=word+" ✓";
      ends=0;
      if(window.KulibertPrefs) KulibertPrefs.cue("next");
      return;
    }
    el.classList.remove("is-done");
    el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  }
  document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>show(b.dataset.tab));
  document.getElementById("mode-btn").onclick=()=>{
    document.body.classList.toggle("student");
    const on=document.body.classList.contains("student");
    const btn=document.getElementById("mode-btn");
    btn.textContent=on?SprocketI18n.tx("normal"):SprocketI18n.tx("big");
    btn.setAttribute("aria-pressed", on?"true":"false");
  };
  document.getElementById("dark-btn").onclick=()=>{
    document.body.classList.toggle("dark");
    SprocketI18n.paintNav();
  };
  function bootLang(){
    if(window.KulibertPrefs){
      const p=KulibertPrefs.get();
      if(p.size==="L"||p.size==="XL"){
        document.body.classList.add("student");
        document.getElementById("mode-btn").setAttribute("aria-pressed","true");
      }
    }
    show(tab||"home");
  }
  window.addEventListener("kulibert-lang", function(){
    if(window.KulibertI18n && KulibertI18n.ready) KulibertI18n.ready(null, bootLang);
    else bootLang();
  });
  if ("serviceWorker" in navigator && location.protocol.indexOf("http")===0) {
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  }
  bootLang();
  setInterval(tick,500);
  </script>
    <script src="/shared/kw-who.js?v=2026-09-29-fit"></script>
</body>
</html>
