<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E8A92">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sprocket">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>Sprocket</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="dark">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true">
        <ellipse cx="32" cy="34" rx="22" ry="16" fill="#E6F8F9"/>
        <circle cx="23" cy="33" r="8.2" fill="#fff"/>
        <circle cx="41" cy="33" r="8.2" fill="#fff"/>
        <circle cx="23" cy="33" r="5.4" fill="#FFC130"/>
        <circle cx="41" cy="33" r="5.4" fill="#FFC130"/>
        <circle cx="24.6" cy="32.2" r="2.4" fill="#343B45"/>
        <circle cx="42.6" cy="32.2" r="2.4" fill="#343B45"/>
        <path d="M26 42c2.2 2.4 9.8 2.4 12 0" fill="none" stroke="#343B45" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      Sprocket
      <span class="verchip">1.4.0</span>
    </div>
    <div class="tools">
      <button type="button" id="dark-btn">Light</button>
      <button type="button" id="mode-btn">Big type</button>
    </div>
  </header>
  <main id="app"></main>
  <nav class="nav" aria-label="Main">
    <button type="button" class="on" data-tab="home"><span>⌂</span>Home</button>
    <button type="button" data-tab="convert"><span>↔</span>Convert</button>
    <button type="button" data-tab="stock"><span>■</span>Stock</button>
    <button type="button" data-tab="timers"><span>⏱</span>Timers</button>
    <button type="button" data-tab="help"><span>?</span>Help</button>
    <button type="button" data-tab="more"><span>⚙</span>More</button>
  </nav>
  <script>
  const KEY="printkit-v2";
  const views={
    home:`<div class="wrap"><h1>Shop desk</h1>
      <div class="pills">
        <button class="pill-btn" data-tab="stock"><b>4</b> starter spools</button>
        <button class="pill-btn" data-tab="timers">Timers</button>
        <button class="pill-btn">P1S</button>
      </div>
      <div class="card"><strong>Before you print</strong>
        <label class="check"><input type="checkbox"> Build plate is clean</label>
        <label class="check"><input type="checkbox"> Glue on if the plate needs it</label>
        <label class="check"><input type="checkbox"> Enough filament</label>
        <label class="check"><input type="checkbox"> AMS colors match the file</label>
        <label class="check"><input type="checkbox"> Hands out. Door / cover clear</label>
        <label class="check"><input type="checkbox"> Poop chute is clear</label>
      </div>
      <div class="card"><strong>Stay safe</strong><p class="muted">Hot nozzle. Moving parts. Do not reach in while it prints. Teacher starts the job.</p></div>
      <div class="quick">
        <button class="btn secondary" data-tab="convert">Convert</button>
        <button class="btn secondary" data-tab="stock">AMS / stock</button>
        <button class="btn secondary" data-tab="help">Bambu help</button>
        <button class="btn secondary" data-tab="timers">Timers</button>
      </div></div>`,
    convert:`<div class="wrap"><h1>Convert</h1>
      <div class="card"><label>mm</label><input id="mm" type="number" value="25.4">
      <div class="big" id="mmout"></div></div>
      <div class="card"><label>C</label><input id="c" type="number" value="215">
      <div class="big" id="cout"></div></div>
      <p class="formula">1 in = 25.4 mm. F = C × 9/5 + 32. Always check the spool.</p></div>`,
    stock:`<div class="wrap"><h1>Stock</h1>
      <div class="card"><strong>AMS map</strong>
        <div class="ams-grid">
          <div class="ams-slot"><b>AMS 1</b><span>Jade White PLA</span><small>820 g</small></div>
          <div class="ams-slot"><b>AMS 2</b><span>Black PLA</span><small>140 g · low</small></div>
          <div class="ams-slot"><b>AMS 3</b><span>Teal PLA</span><small>610 g</small></div>
          <div class="ams-slot"><b>AMS 4</b><span>Yellow PETG</span><small>430 g</small></div>
        </div></div></div>`,
    timers:`<div class="wrap"><h1>Timers</h1>
      <div class="card"><strong id="tlab">No timer</strong><div class="timer-time" id="tclk">0:00</div>
      <div class="chips">
        <button class="chip" data-min="120">Print 2 h</button>
        <button class="chip" data-min="20">Cool 20</button>
        <button class="chip" data-min="2">Glue 2</button>
        <button class="chip" data-min="240">Dry PLA 4 h</button>
      </div></div></div>`,
    help:`<div class="wrap"><h1>Bambu help</h1>
      <div class="help">
        <a href="https://wiki.bambulab.com/en/studio-handy" target="_blank" rel="noopener">Studio + Handy hub</a>
        <a href="https://wiki.bambulab.com/en/ams" target="_blank" rel="noopener">AMS guides</a>
        <a href="https://wiki.bambulab.com/en/filament-acc" target="_blank" rel="noopener">Filament wiki</a>
        <a href="https://wiki.bambulab.com/en/software/bambu-studio/failed-to-connect-printer" target="_blank" rel="noopener">Cannot connect printer</a>
      </div>
      <div class="warnbox">Official Bambu pages only. Handy needs cloud mode.</div></div>`,
    more:`<div class="wrap"><h1>More</h1>
      <div class="card"><strong>Sprocket 1.4.0</strong>
        <p class="muted">Classroom helper. Data key printkit-v2. No live printer control. Open sliced files in Studio on the teacher PC. Full converters, stock edit, queue, and backup are in the local Sprocket.html build.</p>
      </div></div>`
  };
  let ends=0;
  function show(name){
    document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on", b.dataset.tab===name));
    document.getElementById("app").innerHTML=views[name]||views.home;
    document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>show(b.dataset.tab));
    if(name==="convert"){
      const run=()=>{
        const mm=Number(document.getElementById("mm").value);
        document.getElementById("mmout").textContent=mm+" mm  ·  "+(mm/25.4).toFixed(2)+" in";
        const c=Number(document.getElementById("c").value);
        document.getElementById("cout").textContent=c+" C  =  "+(c*9/5+32).toFixed(1)+" F";
      };
      document.getElementById("mm").oninput=run;
      document.getElementById("c").oninput=run;
      run();
    }
    if(name==="timers"){
      document.querySelectorAll("[data-min]").forEach(b=>b.onclick=()=>{
        ends=Date.now()+Number(b.dataset.min)*60000;
        document.getElementById("tlab").textContent=b.textContent;
      });
    }
  }
  function tick(){
    const el=document.getElementById("tclk");
    if(!el||!ends) return;
    const s=Math.max(0,Math.floor((ends-Date.now())/1000));
    el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  }
  document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>show(b.dataset.tab));
  document.getElementById("mode-btn").onclick=()=>document.body.classList.toggle("student");
  document.getElementById("dark-btn").onclick=()=>{
    document.body.classList.toggle("dark");
    document.getElementById("dark-btn").textContent=document.body.classList.contains("dark")?"Light":"Dark";
  };
  if ("serviceWorker" in navigator && location.protocol.indexOf("http")===0) {
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  }
  show("home");
  setInterval(tick,500);
  </script>
</body>
</html>
