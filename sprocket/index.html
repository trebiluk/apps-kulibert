<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E8A92">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sprocket">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <title>Sprocket</title>
  <style>
  .offline-dot { width:8px; height:8px; border-radius:50%; background:#7FE0E6; display:inline-block; margin-right:6px; }
  body.offline .offline-dot { background:#E05A5A; }
  .qty-row { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .qty-row .btn { min-height:40px; padding:6px 10px; flex:1; }
  body.dark .sheet { background:#1C232C; color:var(--ink); }
  </style>
</head>
<body class="dark">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true">
        <ellipse cx="32" cy="34" rx="22" ry="16" fill="#E6F8F9"/>
        <circle cx="23" cy="33" r="8.2" fill="#fff"/>
        <circle cx="41" cy="33" r="8.2" fill="#fff"/>
        <circle cx="23" cy="33" r="5.4" fill="#FFC130"/>
        <circle cx="41" cy="33" r="5.4" fill="#FFC130"/>
        <circle cx="24.6" cy="32.2" r="2.4" fill="#343B45"/>
        <circle cx="42.6" cy="32.2" r="2.4" fill="#343B45"/>
        <path d="M26 42c2.2 2.4 9.8 2.4 12 0" fill="none" stroke="#343B45" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      Sprocket
      <span class="verchip" id="ver-chip">1.4.0</span>
    </div>
    <div class="tools">
      <button type="button" id="dark-btn">Dark</button>
      <button type="button" id="mode-btn">Big type</button>
    </div>
  </header>
  <main id="app"><div class="wrap"><div class="card"><strong>Sprocket</strong><p class="muted">Loading tools…</p></div></div></main>
  <nav class="nav" aria-label="Main">
    <button type="button" class="on" data-tab="home"><span>⌂</span>Home</button>
    <button type="button" data-tab="convert"><span>↔</span>Convert</button>
    <button type="button" data-tab="stock"><span>■</span>Stock</button>
    <button type="button" data-tab="timers"><span>⏱</span>Timers</button>
    <button type="button" data-tab="help"><span>?</span>Help</button>
    <button type="button" data-tab="more"><span>⚙</span>More</button>
  </nav>
  <script src="./a.js"></script>
  <script src="./b.js"></script>
  <script>
  function bootFail(){
    var root=document.getElementById("app");
    if(root) root.innerHTML="<div class=\"wrap\"><div class=\"card\"><h1>Sprocket 1.4.0</h1><p class=\"muted\">Tools did not load. Hard refresh this page (or clear cache). Need a.js and b.js next to index.html.</p></div></div>";
  }
  if (typeof render !== "function") {
    bootFail();
  } else {
    try {
      document.querySelectorAll(".nav button").forEach(function(b){ b.onclick=function(){ setTab(b.dataset.tab); }; });
      document.getElementById("mode-btn").onclick=function(){ state.studentMode=!state.studentMode; save(); render(); };
      var darkBtn=document.getElementById("dark-btn");
      if (darkBtn) darkBtn.onclick=function(){ state.dark=!state.dark; save(); render(); };
      window.addEventListener("hashchange", function(){ var name=location.hash.slice(1); if(name && name!==tab) setTab(name); });
      window.addEventListener("online", function(){ render(); });
      window.addEventListener("offline", function(){ render(); });
      var bootTab=location.hash.slice(1);
      if (["home","convert","stock","timers","help","more"].indexOf(bootTab)>=0) tab=bootTab;
      if ("serviceWorker" in navigator && location.protocol.indexOf("http")===0) {
        navigator.serviceWorker.register("./sw.js").catch(function(){});
      }
      render();
      setInterval(tick, 1000);
    } catch (err) {
      bootFail();
    }
  }
  </script>
</body>
</html>
