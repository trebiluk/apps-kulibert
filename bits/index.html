<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bits and Bobs</title>
<meta name="description" content="Bits and Bobs is a tech-room dashboard of live shop tools.">
<meta name="theme-color" content="#071018">
<link rel="icon" href="/bits/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/bits/manifest.webmanifest">
<link rel="stylesheet" href="/bits/hud.css?v=2.0.2">
<script src="/shared/kulibert-bar.js?v=2026-10-04-i18n" data-app="bits" data-version="BB 2.0.2" defer></script>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  if (new URLSearchParams(location.search).get("theme") === "classic") {
    fetch("/bits/classic.html", { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (html) {
      document.open();
      document.write(html);
      document.close();
    });
    return;
  }
  var s = document.createElement("script");
  s.src = "/bits/hud.js?v=2.0.2";
  document.body.appendChild(s);
})();
</script>
</body>
</html>
