<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bits and Bobs</title>
<meta name="description" content="Bits and Bobs is a tech-room dashboard of live shop tools.">
<meta name="theme-color" content="#071018">
<link rel="icon" href="/bits/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/bits/manifest.webmanifest">
<link rel="stylesheet" href="/fonts/room.css?v=2026-10-04-i18n">
<link rel="stylesheet" href="/bits/hud.css?v=2.2.0">
<script src="/shared/kulibert-prefs.js?v=2026-10-04-i18n"></script>
<script src="/shared/kulibert-i18n.js?v=2026-10-04-i18n"></script>
<script src="/shared/kulibert-bar.js?v=2026-10-12-one-menu" data-app="bits" data-version="BB 2.2.0" data-rtl="1" data-menu="#bits-menu" defer></script>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  if (new URLSearchParams(location.search).get("theme") === "classic") {
    fetch("/bits/classic.html", { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (html) {
      document.open();
      document.write(html);
      document.close();
    });
    return;
  }
  var files = [
    "/bits/i18n.js?v=2.2.0",
    "/bits/i18n-packs.js?v=2.2.0",
    "/bits/i18n-packs2.js?v=2.2.0",
    "/bits/i18n-boot.js?v=2.2.0",
    "/bits/tool-icons.js?v=2.2.0",
    "/bits/hud.js?v=2.2.0"
  ];
  function next() {
    if (!files.length) return;
    var s = document.createElement("script");
    s.src = files.shift();
    s.onload = next;
    s.onerror = next;
    document.body.appendChild(s);
  }
  next();
})();
</script>
</body>
</html>
