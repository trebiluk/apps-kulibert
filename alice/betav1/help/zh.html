<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>玩法</title><body style="background:#E8DCC0;color:#2B2824;font-family:Georgia,serif;max-width:640px;margin:auto;padding:16px"><h1>玩法</h1><p>两位玩家共用一个屏幕，谁也无法单独过关。</p><p>Alice（草原犬鼠）：A / D 移动，W 跳，Q 使用，E 呼叫。</p><p>Wonderland（野兔）：← / → 移动，↑ 跳，逗号 使用，句号 呼叫。</p><p>Wonderland 跳得高，能够到岩架上的拉杆。Alice 力气大，能推箱子、拖木板。</p><p>拉下拉杆，大门升起。把箱子推到门下面让它关不上。拖开木板，两人一起走到门口。</p><p><a href="../index.html">Alice 和 Wonderland — 第1关：大门与岩架</a></p></body></html>
