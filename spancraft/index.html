<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#050814"/>
  <meta name="spancraft-rev" content="2026-09-23-sc-1.3.12"/>
  <meta name="description" content="SpanCraft — stretch a span, hang a load, read the stars."/>
  <title>SpanCraft · The Tech Room</title>
  <link rel="icon" href="/icons/icon-spancraft.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="/fonts/room.css"/>
  <link rel="stylesheet" href="./styles.css?v=1.3.12"/>
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="brand" href="/">
        <img src="/icons/icon-spancraft.svg" width="40" height="40" alt=""/>
        <span>
          <h1>SpanCraft</h1>
          <p>SC 1.3.12</p>
        </span>
      </a>
      <div class="top-actions">
        <span id="toys-chip" class="toys-chip" hidden>Toys 0</span>
        <button type="button" id="isles-btn" class="chip-btn">Gap Isles</button>
        <button type="button" id="assist" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/></svg>
          Assist
        </button>
        <button type="button" id="retry" class="fat">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          Retry
        </button>
        <a href="/">Room</a>
      </div>
    </header>

    <p class="caption" id="caption" role="status" aria-live="polite" aria-atomic="true">
      <strong id="cap-word">Ready</strong>
      <span id="cap-mark" aria-hidden="true"></span>
      <span id="mastery-chip" class="mastery-chip" hidden></span>
      <span id="cap-text">Place three Decks across the gap, then Test. That is the first clear.</span>
      <button type="button" id="retry-now" hidden>Retry</button>
    </p>

    <div class="kinds" id="kinds">
      <button type="button" role="radio" data-kind="deck" aria-checked="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="9" width="18" height="6" rx="1.5"/></svg>
        Deck
      </button>
      <button type="button" role="radio" data-kind="beam" aria-checked="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 14c4-6 14-6 18 0"/></svg>
        Beam
      </button>
      <button type="button" role="radio" data-kind="pier" aria-checked="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="18" rx="1.5"/></svg>
        Pier
      </button>
      <div class="edge-pocket">
        <button type="button" id="edge-btn" aria-haspopup="dialog" aria-controls="help-overlay">Help</button>
        <div id="edge-menu" hidden>
          <button type="button" data-edge="howto">How to play</button>
          <a href="/">Room</a>
          <a href="./changelog.html">For class</a>
        </div>
      </div>
    </div>

    <div class="bet-bar" id="bet-bar" hidden>
      <p class="bet-label">Bet before Test</p>
      <button type="button" class="bet-chip" data-bet="hold" id="bet-hold">It’ll hold</button>
      <button type="button" class="bet-chip" data-bet="fall" id="bet-fall">It’ll fall</button>
    </div>

    <nav class="pocket" aria-label="Tools">
      <button type="button" id="tool-add" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Add
      </button>
      <button type="button" id="tool-move" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M8 7l4-4 4 4M8 17l4 4 4-4M7 8 3 12l4 4M17 8l4 4-4 4"/></svg>
        Move
      </button>
      <button type="button" id="tool-delete" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V5h6v2M8 7l1 13h6l1-13"/></svg>
        Delete
      </button>
      <button type="button" id="tool-test" class="go">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v5M8 8h8l-1.2 4H9.2L8 8zM7 20h10M12 12v8"/></svg>
        Test
      </button>
    </nav>

    <div class="stage">
      <canvas id="board" tabindex="0" aria-label="Bridge span. Drag a grip. It stretches, then drops. Enter uses the tool."></canvas>
      <div id="snap-hint" class="snap-hint" hidden aria-hidden="true">First Deck here</div>
      <div id="flash-plate" class="flash-plate" role="status" aria-live="polite" hidden>
        <p class="flash-shout" id="flash-shout"></p>
        <p class="flash-caption" id="flash-caption"></p>
        <span class="flash-mark" id="flash-mark" aria-hidden="true"></span>
      </div>
    </div>
  </div>

  <div id="isle-map" class="isle-map" hidden role="dialog" aria-modal="true" aria-labelledby="isle-title">
    <div class="isle-card-wrap">
      <header class="isle-head">
        <h2 id="isle-title">Gap Isles</h2>
        <button type="button" id="isle-close" class="fat">Close</button>
      </header>
      <div class="isle-grid" id="isle-grid"></div>
    </div>
  </div>

  <script src="./vendor/matter.min.js"></script>
  <script type="module" src="./app.js?v=1.3.12"></script>

    <div id="assist-plate" class="assist-plate" role="status" aria-live="polite" hidden>
      <strong>Assist</strong>
      <p id="assist-plate-text"></p>
      <button type="button" id="assist-gotit" class="fat assist-gotit">Got it</button>
    </div>
</body>
</html>
